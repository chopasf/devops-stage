apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: demo
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: nginx-logs
        paths:
          - /var/log/pods/demo_nginx-*/nginx/*.log
        parsers:
          - container: {}

    output.file:
      path: /var/lib/filebeat/output
      filename: nginx
      codec.format:
        string: '%{[message]}'

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: demo
spec:
  selector:
    matchLabels:
      app: filebeat
  template:
    metadata:
      labels:
        app: filebeat
    spec:
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.1.4
          args:
            - "-c"
            - "/etc/filebeat.yml"
            - "-e"
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/filebeat.yml
              subPath: filebeat.yml
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: output
              mountPath: /var/lib/filebeat/output
      volumes:
        - name: config
          configMap:
            name: filebeat-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: output
          hostPath:
            path: /var/log/filebeat-output
            type: DirectoryOrCreate
